[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hansenkit"
version = "0.1.0"
description = "Rights-aware research baselines for Hansen solubility parameters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "rdkit>=2024.9,<2027",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.6,<5"]

[project.scripts]
hansenkit = "hansenkit.cli:main"

[project.urls]
Repository = "https://github.com/myu65/hansenkit"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/hansenkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
